name: Build qxhook dylib

# 触发方式：手动点 Run workflow，或 push 到 main
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -o qxhook.dylib \
            qxhook.m
          echo "=== built ==="
          ls -la qxhook.dylib
          file qxhook.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qxhook-dylib
          path: qxhook.dylib
          retention-days: 7
